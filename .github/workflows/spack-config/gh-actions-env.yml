spack:
  view: /opt/view
  config:
    # Pin the install root to a fixed absolute path, not one under
    # $GITHUB_WORKSPACE (whose length varies with the repo name: e.g.
    # /__w/ffcx/ffcx vs /__w/basix/basix vs /__w/dolfinx/dolfinx). All
    # three repos push to and pull from the same OCI buildcache, so a
    # binary relocated to fit one repo's workspace path may not have
    # room to fit another's -- padded_length reserves enough slack for
    # that relocation regardless of which repo built it.
    install_tree:
      root: /opt/spack
      padded_length: 128

  concretizer:
    unify: true
    reuse: false

  packages:
    all:
      # Pin to the generic microarchitecture the shared GitHub Actions
      # build cache (added by spack/setup-spack) and our own
      # local-buildcache are built for. Without this, concretization picks
      # the runner's exact detected microarch, which does not match the
      # cache's hashes, so every package (including LLVM, for numba)
      # rebuilds from source instead of being pulled as a binary.
      require:
      - target=x86_64_v3

    # Use the container's mesa instead of building one. mesa@25.0.5 (the
    # newest version the pinned packages_ref knows) does not compile
    # against Ubuntu 26.04's glibc -- its bundled C11 threads polyfill
    # redeclares 'once_flag'/'call_once' -- and newer mesa releases reject
    # meson options the recipe still passes ('gallium-vdpau'). The distro
    # build matches the container's glibc by construction. Keep the
    # version in step with the ubuntu:26.04 image used by dolfinx.yml.
    # (Same fix as FEniCS/dolfinx's own
    # .github/workflows/spack-config/gh-actions-env-test.yml.)
    mesa:
      buildable: false
      externals:
      - spec: mesa@25.1.7+osmesa+glx+opengl
        prefix: /usr

  mirrors:
    local-buildcache:
      url: oci://ghcr.io/fenics/spack-buildcache
      binary: true
      signed: false
      access_pair:
        id_variable: GITHUB_USER
        secret_variable: GITHUB_TOKEN
