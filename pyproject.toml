[build-system]
requires = [
    "setuptools>=77.0.3", # Ensuring license field is correctly parsed
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "fenics-ffcx"
version = "0.12.0.dev0"
description = "The FEniCSx Form Compiler"
readme = "README.md"
requires-python = ">=3.11"
license = "LGPL-3.0-or-later"
license-files = ["LICENSE", "COPYING*", "UNLICENSE"]
authors = [
    { email = "fenics-steering-council@googlegroups.com" },
    { name = "FEniCS Steering Council" },
]
dependencies = [
    "numpy>=1.21",
    "cffi",
    "setuptools>=77.0.3",        # cffi with compilation support requires setuptools
    "fenics-basix>=0.12.0.dev0",
    "fenics-ufl>=2026.3.0.dev0",
]

[project.urls]
homepage = "https://fenicsproject.org"
repository = "https://github.com/fenics/ffcx.git"
documentation = "https://docs.fenicsproject.org"

[project.scripts]
ffcx = "ffcx:__main__.main"

[project.optional-dependencies]
lint = ["ruff"]
docs = ["sphinx", "pydata-sphinx-theme"]
optional = ["numba", "pygraphviz>=2.0.0"]
test = ["pytest >= 6.0", "sympy", "numba"]
ci = [
    "coveralls",
    "coverage>=7.0.0",
    "pytest-cov",
    "pytest-xdist",
    "pyrefly>=1.4",
    "fenics-ffcx[docs]",
    "fenics-ffcx[lint]",
    "fenics-ffcx[test]",
]

[tool.setuptools]
packages = [
    "ffcx",
    "ffcx.codegeneration",
    "ffcx.codegeneration.C",
    "ffcx.codegeneration.numba",
    "ffcx.ir",
    "ffcx.ir.analysis",
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra"
testpaths = ["test"]
norecursedirs = ["libs", "docs"]
log_cli = true
# Registered for runs without pytest-xdist, which defines it
markers = ["xdist_group: tests sharing compiled forms, run on one worker with --dist loadgroup"]

[tool.pyrefly]
project-includes = ["ffcx"]

# Everything in the strict preset except the four kinds opted out of
# below, which is considerably more than the mypy configuration this
# replaced enabled.
preset = "strict"

# Modules the mypy configuration this replaced exempted from checking.
# They are replaced with Any unconditionally rather than only when they
# cannot be imported, so the result does not depend on whether a given
# platform happens to have the package installed: pygraphviz is only
# installed on some CI platforms, and cffi ships no type information.
# UFL is included because most of the Any values in FFCx come from it.
replace-imports-with-any = ["cffi", "pygraphviz", "ufl", "ufl.*"]

# mypy's check_untyped_defs
check-unannotated-defs = true
enabled-ignores = ["pyrefly"]

[tool.pyrefly.errors]
# mypy's disallow_untyped_defs
implicit-any-parameter = true
unannotated-return = true
# mypy's warn_unused_ignores
unused-ignore = true
# mypy's warn_return_any
no-any-return = true
# Stricter than the mypy configuration this replaced: mypy's equivalent of
# unbound-name (possibly-undefined) is opt-in and was not enabled.
unbound-name = true
implicit-reexport = true

# The four kinds of the strict preset that FFCx does not satisfy yet, with
# what each currently costs. They are annotation debt rather than defects,
# so they are best paid down a package at a time.
implicit-any-lambda = false          # 43
implicit-any-type-argument = false   # 38
missing-override-decorator = false   # 18
implicit-any-empty-container = false # 16

# mypy turned check_untyped_defs and disallow_untyped_defs off for these
# two packages. Goal would be to drop these long-term.
[[tool.pyrefly.sub-config]]
matches = "ffcx/ir/**"
check-unannotated-defs = false
[tool.pyrefly.sub-config.errors]
implicit-any-parameter = false
unannotated-return = false

[[tool.pyrefly.sub-config]]
matches = "ffcx/codegeneration/**"
check-unannotated-defs = false
[tool.pyrefly.sub-config.errors]
implicit-any-parameter = false
unannotated-return = false

[tool.ruff]
line-length = 100
indent-width = 4

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
    # "N", # pep8-naming
    "E",   # pycodestyle
    "W",   # pycodestyle
    "D",   # pydocstyle
    "F",   # pyflakes
    "I",   # isort
    "RUF", # Ruff-specific rules
    "UP",  # pyupgrade
    "ICN", # flake8-import-conventions
    "NPY", # numpy-specific rules
    "FLY", # use f-string not static joins
    "LOG", # https://docs.astral.sh/ruff/rules/#flake8-logging-log
    # "ISC", # https://docs.astral.sh/ruff/rules/#flake8-implicit-str-concat-isc
    # "B", # https://docs.astral.sh/ruff/rules/#flake8-bugbear-b
    # "A", # https://docs.astral.sh/ruff/rules/#flake8-builtins-a
]
ignore = ["RUF005", "RUF012", "RUF015"]

[tool.ruff.lint.per-file-ignores]
"test/*" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"
